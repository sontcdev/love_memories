name: web_embee
description: Flutter Web application with Supabase backend
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Routing
  go_router: ^13.0.0
  
  # Supabase
  supabase_flutter: ^2.0.0
  
  # UI
  google_fonts: ^6.1.0
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # Utilities
  crypto: ^3.0.3
  flutter_dotenv: ^5.1.0
  intl: ^0.19.0
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0
  shared_preferences: ^2.2.2
  flutter_staggered_grid_view: ^0.7.0
  photo_view: ^0.14.0
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Add .env file as asset so it can be loaded
  assets:
    - .env
